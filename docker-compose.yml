# Chạy cả stack bán được: API + UI.
#   docker compose up --build
#   UI:  http://localhost:5173
#   API: http://localhost:8090/docs
#
# Chỉ API (dev): docker compose up --build crawl-service

services:
  crawl-service:
    build: ./crawl-service
    ports:
      - "${CRAWL_SERVICE_PORT:-8090}:8000"
    env_file:
      - ./crawl-service/.env
    environment:
      TRANSLATE_SERVICE_URL: http://translate-service:8000
      CRAWL_PUBLIC_URL: http://crawl-service:8000
    volumes:
      - crawl_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Cùng origin qua nginx proxy — để trống = relative /api
        VITE_API_BASE_URL: ""
        VITE_TRANSLATE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - crawl-service
      - translate-service
    restart: unless-stopped

  translate-service:
    build: ./translate-service
    ports:
      - "${TRANSLATE_SERVICE_PORT:-8010}:8000"
    env_file:
      - ./translate-service/.env
    environment:
      CRAWL_SERVICE_URL: http://crawl-service:8000
    volumes:
      - translate_data:/app/data
    depends_on:
      - crawl-service
    # Cho AI local (Ollama/LM Studio) chạy trên máy host — container gọi
    # host.docker.internal thay vì localhost (localhost trong container là
    # chính nó). Docker Desktop (Mac/Windows) đã tự có sẵn; dòng dưới cần
    # thiết để hoạt động trên Docker Engine (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  crawl_data:
  translate_data:
