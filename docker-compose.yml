# Chạy cả stack bán được: API + UI.
#   docker compose up --build
#   UI:  http://localhost:5173
#   API: http://localhost:8090/docs
#
# Chỉ API (dev): docker compose up --build crawl-service

services:
  crawl-service:
    build: ./crawl-service
    ports:
      - "${CRAWL_SERVICE_PORT:-8090}:8000"
    env_file:
      - ./crawl-service/.env
    environment:
      TRANSLATE_SERVICE_URL: http://translate-service:8000
      CRAWL_PUBLIC_URL: http://crawl-service:8000
      FOLIO_API_TOKEN: ${FOLIO_API_TOKEN:-}
    volumes:
      - crawl_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Cùng origin qua nginx proxy — để trống = relative /api
        VITE_API_BASE_URL: ""
        VITE_TRANSLATE_API_BASE_URL: ""
        VITE_TTS_API_BASE_URL: ""
        VITE_WRITE_API_BASE_URL: ""
        VITE_AI_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - crawl-service
      - translate-service
      - tts-service
      - write-service
      - ai-service
    restart: unless-stopped

  translate-service:
    build: ./translate-service
    ports:
      - "${TRANSLATE_SERVICE_PORT:-8010}:8000"
    env_file:
      - ./translate-service/.env
    environment:
      CRAWL_SERVICE_URL: http://crawl-service:8000
      AI_API_BASE_URL: http://ai-service:8000
      FOLIO_API_TOKEN: ${FOLIO_API_TOKEN:-}
    volumes:
      - translate_data:/app/data
    depends_on:
      - crawl-service
      - ai-service
    # Cho AI local (Ollama/LM Studio) chạy trên máy host — container gọi
    # host.docker.internal thay vì localhost (localhost trong container là
    # chính nó). Docker Desktop (Mac/Windows) đã tự có sẵn; dòng dưới cần
    # thiết để hoạt động trên Docker Engine (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tts-service:
    build: ./tts-service
    ports:
      - "${TTS_SERVICE_PORT:-8011}:8000"
    env_file:
      - ./tts-service/.env
    environment:
      AI_API_BASE_URL: http://ai-service:8000
      FOLIO_API_TOKEN: ${FOLIO_API_TOKEN:-}
    volumes:
      - tts_data:/app/data
    depends_on:
      - ai-service
    restart: unless-stopped

  write-service:
    build: ./write-service
    ports:
      - "${WRITE_SERVICE_PORT:-8012}:8000"
    env_file:
      - ./write-service/.env
    environment:
      AI_API_BASE_URL: http://ai-service:8000
      FOLIO_API_TOKEN: ${FOLIO_API_TOKEN:-}
    volumes:
      - write_data:/app/data
    depends_on:
      - ai-service
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    ports:
      - "${AI_SERVICE_PORT:-8013}:8000"
    env_file:
      - ./ai-service/.env
    environment:
      FOLIO_API_TOKEN: ${FOLIO_API_TOKEN:-}
    volumes:
      - ai_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  crawl_data:
  translate_data:
  tts_data:
  write_data:
  ai_data:
