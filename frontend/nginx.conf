server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Translate API — trước /api/ chung để không bị nuốt bởi crawl.
    location /api/translate/ {
        proxy_pass http://translate-service:8000/api/translate/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # API + health → crawl-service (tên service trong docker compose).
    location /api/ {
        proxy_pass http://crawl-service:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location /docs {
        proxy_pass http://crawl-service:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://crawl-service:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
